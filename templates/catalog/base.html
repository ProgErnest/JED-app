<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title|default:"Catalogue" }} — JED</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 1rem; line-height: 1.5; }
        header { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid #ccc; }
        h1 { font-size: 1.25rem; margin: 0; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .btn { display: inline-block; padding: 0.4rem 0.9rem; background: #0066cc; color: #fff; border-radius: 4px; text-decoration: none; font-size: 0.9rem; }
        .btn:hover { background: #0052a3; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 0.6rem 0.8rem; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.95rem; }
        th { background: #f5f5f5; }
        .actions { white-space: nowrap; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
        input[type="text"], input[type="number"], input[type="url"], textarea, select { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        textarea { min-height: 80px; resize: vertical; }
        input[type="checkbox"] { width: auto; margin-right: 0.4rem; }
        .form-row { display: flex; gap: 1rem; flex-wrap: wrap; }
        .form-row > .form-group { flex: 1 1 200px; }
        button[type="submit"] { padding: 0.55rem 1.2rem; background: #28a745; color: #fff; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 0.5rem; }
        button[type="submit"]:hover { background: #218838; }
        .cancel { margin-left: 0.75rem; }
        .hint { font-size: 0.85rem; color: #666; margin-top: 0.25rem; }
        .errorlist { color: #dc3545; list-style: none; padding: 0; margin: 0.3rem 0 0; }
        .errorlist li { background: #f8d7da; padding: 0.5rem; border-radius: 4px; margin-bottom: 0.4rem; }
        .navbar a { margin-right: 1.25rem; font-weight: 600; }
        .navbar a.active { text-decoration: underline; }
        .flash { padding: 0.75rem 1rem; margin-bottom: 1rem; border-radius: 4px; font-size: 0.95rem; }
        .flash.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .flash.error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    </style>
</head>
<body>
<header>
    <nav class="navbar">
        <a href="{% url 'accounts:home' %}">Accueil</a>
        <a href="{% url 'catalog:home' %}" class="active">Catalogue</a>
        {% if user.is_authenticated %}
        <a href="{% url 'accounts:activity_detail' activity_slug=activity.slug %}" style="margin-left:auto;">Activité : {{ activity.name }}</a>
        {% endif %}
    </nav>
</header>
<main>
    {% if messages %}
        {% for message in messages %}
        <div class="flash {{ message.tags }}">{{ message }}</div>
        {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
